openapi: 3.0.3
info:
  title: Coffee Shop Case Study Reference API
  version: 1.1.0
  description: Senior backend order/checkout implementation. Based on reference/openapi-draft.yaml;
    documented clarifications and limits are in docs/DESIGN.md.
servers:
- url: http://localhost:8080
  description: Local candidate service or contract-backed mock
tags:
- name: Customer
- name: Owner
paths:
  /api/v1/menu:
    get:
      tags:
      - Customer
      operationId: getMenu
      summary: Retrieve available menu and promotions
      responses:
        '200':
          description: Menu snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '500':
          description: Unexpected server error; retry an uncertain write with the
            same key and body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Active catalogue items, including sold-out items with available=false.
        There are no catalogue mutation endpoints in this slice.
  /api/v1/orders:
    post:
      tags:
      - Customer
      operationId: createOrder
      summary: Create an order with authoritative server pricing
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created, or existing same-key/same-payload order replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          headers:
            Idempotency-Replayed:
              description: Whether this exact stored result was replayed.
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          description: Unexpected error; no successful response was committed. Retry
            using the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/orders/{orderId}:
    get:
      tags:
      - Customer
      operationId: getOrder
      summary: Retrieve order and its authoritative payment state
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Unexpected server error; retry an uncertain write with the
            same key and body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/orders/{orderId}/payments/mock:
    post:
      tags:
      - Customer
      operationId: simulatePayment
      summary: Deterministically approve or decline a payment attempt
      description: APPROVE locks the order, then inventory rows in item-ID order,
        and atomically deducts inventory, records movements, marks PAID and inserts
        one receipt. A new APPROVE key after PAID returns the paid order without side
        effects. DECLINE on a pending order changes no inventory. A new DECLINE key
        after PAID returns 409 ORDER_ALREADY_PAID. An old committed DECLINE key replays
        its original attempt result; GET order returns current state.
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentRequest'
      responses:
        '200':
          description: Approved, declined or safely replayed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
          headers:
            Idempotency-Replayed:
              description: Whether this exact stored result was replayed.
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          description: Unexpected error; no successful response was committed. Retry
            using the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/orders/{orderId}/receipt:
    get:
      tags:
      - Customer
      operationId: getReceipt
      summary: Retrieve receipt, available only after confirmed payment
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Receipt for a paid order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Unexpected server error; retry an uncertain write with the
            same key and body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/owner/orders:
    get:
      tags:
      - Owner
      operationId: getPaidOrders
      security:
      - ownerBasic: []
      summary: List paid orders, ascending by paidAt then orderNumber
      parameters:
      - name: status
        in: query
        required: false
        description: Currently only PAID is supported in this assessment slice
        schema:
          type: string
          enum:
          - PAID
          default: PAID
      responses:
        '200':
          description: Sorted paid orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaidOrdersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Unexpected server error; retry an uncertain write with the
            same key and body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    ownerBasic:
      type: http
      scheme: basic
      description: Demo-only HTTP Basic scheme; use TLS in any real deployment.
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Exactly one header. Printable ASCII, no spaces. Scope is create-order
        or payment for one specific order. Same normalized payload replays the original
        committed status/body, even if order state changed later. Different payload:
        409. Domain errors and transaction failures roll back the key. Completed records
        have no TTL in this exercise.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[!-~]{8,128}$
  responses:
    BadRequest:
      description: Malformed or unsupported request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Invalid state, insufficient stock or idempotency-key payload conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Semantically invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Owner authentication required
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Basic authentication challenge
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Transient transaction/lock failure. Retry with the same key and
        payload.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Category:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          example: beverages
        name:
          type: string
          example: Beverages
    MenuItem:
      type: object
      required:
      - id
      - categoryId
      - name
      - priceMinor
      - currency
      - availableStock
      - available
      properties:
        id:
          type: string
          example: cappuccino
        categoryId:
          type: string
          example: beverages
        name:
          type: string
          example: Cappuccino
        priceMinor:
          type: integer
          format: int64
          minimum: 0
          example: 450
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        availableStock:
          type: integer
          minimum: 0
          example: 10
        available:
          type: boolean
          example: true
    ComboOffer:
      type: object
      required:
      - id
      - name
      - firstItemId
      - secondItemId
      - bundlePriceMinor
      - active
      properties:
        id:
          type: string
          example: coffee-pastry
        name:
          type: string
          example: Coffee and pastry
        firstItemId:
          type: string
          example: cappuccino
        secondItemId:
          type: string
          example: croissant
        bundlePriceMinor:
          type: integer
          format: int64
          minimum: 0
          example: 700
        active:
          type: boolean
          example: true
    Menu:
      type: object
      required:
      - currency
      - categories
      - items
      - comboOffers
      properties:
        currency:
          type: string
          example: USD
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        comboOffers:
          type: array
          items:
            $ref: '#/components/schemas/ComboOffer'
    CreateOrderRequest:
      type: object
      required:
      - customerName
      - items
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 80
          example: Alex
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - itemId
            - quantity
            properties:
              itemId:
                type: string
                example: cappuccino
                maxLength: 80
              quantity:
                type: integer
                minimum: 1
                maximum: 20
                example: 2
            additionalProperties: false
          maxItems: 100
      description: Customer name is trimmed; item order is normalized. Duplicate item
        IDs are rejected (422). These normalized values determine the idempotency
        fingerprint. Unknown JSON fields, duplicate JSON properties, numeric strings
        and fractional quantities are rejected (400). Customer name must remain nonblank
        after Unicode whitespace trimming.
      additionalProperties: false
    OrderLine:
      type: object
      required:
      - itemId
      - name
      - unitPriceMinor
      - quantity
      - lineTotalMinor
      properties:
        itemId:
          type: string
        name:
          type: string
        unitPriceMinor:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
        lineTotalMinor:
          type: integer
          format: int64
    Order:
      type: object
      required:
      - id
      - orderNumber
      - customerName
      - status
      - currency
      - lines
      - subtotalMinor
      - discountMinor
      - totalMinor
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          example: C-1001
        customerName:
          type: string
          example: Alex
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAID
        currency:
          type: string
          example: USD
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        subtotalMinor:
          type: integer
          format: int64
          minimum: 0
        discountMinor:
          type: integer
          format: int64
          minimum: 0
        totalMinor:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
    MockPaymentRequest:
      type: object
      required:
      - outcome
      properties:
        outcome:
          type: string
          enum:
          - APPROVE
          - DECLINE
      additionalProperties: false
    PaymentResult:
      type: object
      required:
      - outcome
      - order
      properties:
        outcome:
          type: string
          enum:
          - APPROVED
          - DECLINED
        order:
          $ref: '#/components/schemas/Order'
    Receipt:
      type: object
      required:
      - orderNumber
      - customerName
      - currency
      - totalMinor
      - paidAt
      - lines
      properties:
        orderNumber:
          type: string
        customerName:
          type: string
        currency:
          type: string
        subtotalMinor:
          type: integer
          format: int64
        discountMinor:
          type: integer
          format: int64
        totalMinor:
          type: integer
          format: int64
        paidAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    PaidOrdersResponse:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INSUFFICIENT_STOCK
          description: Stable machine-readable error identifier.
        message:
          type: string
          example: Requested quantity is not available.
        details:
          type: object
          additionalProperties: true

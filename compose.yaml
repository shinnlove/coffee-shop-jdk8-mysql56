services:
  db:
    image: coffee-shop-mysql:5.6.30
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    environment:
      MYSQL_DATABASE: coffee_shop
      MYSQL_USER: coffee_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-coffee-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-coffee-root-only}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-./docker/data/mysql}
        target: /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h127.0.0.1
          -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      start_period: 60s
      retries: 40
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: coffee-shop-app:1.9
    platform: linux/amd64
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DEFAULT_SHOP_ID: ${DEFAULT_SHOP_ID:-1}
      DB_URL: jdbc:mysql://db:3306/coffee_shop?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: coffee_app
      DB_PASSWORD: ${DB_PASSWORD:-coffee-local-only}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
